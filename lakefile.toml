name = "fp-lean"
version = "0.1.0"
defaultTargets = ["Fp", "FpAgainstFloatModel", "FpExecutableTests", "fp-executable-test-runner", "Examples"]
moreLeanArgs = ["--tstack=1000000"]
moreGlobalServerArgs = ["--tstack=1000000"]

[[lean_lib]]
name = "Fp"

# A separate top-level library sitting *above* `Fp`: it imports the full `Fp` to prove that
# `PackedFloat` agrees with Lean's `Float.Model` (only available on the Float-Model toolchain).
[[lean_lib]]
name = "FpAgainstFloatModel"

# All executable-testing infrastructure: enumerators, the CSV golden-diff harness, the
# rational/SMT-LIB test suites, and the format-generic differential test against
# `Float.Model`. Keeps `Fp` a pure library. The `Float.Model` dependency (only available on
# the Float-Model toolchain) enters here via `FpExecutableTests.AgainstFloatModel`.
[[lean_lib]]
name = "FpExecutableTests"

[[lean_lib]]
name = "Examples"
# Only the `Examples` root module (and whatever it imports) is built. This keeps the heavy,
# non-CI `Examples/FastInvSqrtFp32.lean` (intentionally not imported) out of `lake build`.
globs = ["Examples"]

[[lean_exe]]
name = "fp-executable-test-runner"
root = "FpExecutableTests.Main"
