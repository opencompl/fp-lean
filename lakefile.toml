name = "fp-lean"
version = "0.1.0"
defaultTargets = ["Fp", "fp-lean-test-suite", "FpTheorems", "FpUnitTests"]
testDriver = "FpUnitTests"
moreLeanArgs = ["--tstack=4096"]
moreGlobalServerArgs = ["--tstack=4096"]

[[lean_lib]]
name = "Fp"

[[lean_lib]]
name = "FpTheorems"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4-nightly-testing"
rev = "nightly-testing-2026-01-14"

[[lean_exe]]
name = "fp-lean-test-suite"
root = "Test"

[[lean_exe]]
name = "FpUnitTests"
root = "FpUnitTests"
