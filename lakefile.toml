name = "fp-lean"
version = "0.1.0"
defaultTargets = ["Fp", "fp-lean", "FpTheorems"]
moreLeanArgs = ["--tstack=4096"]
moreGlobalServerArgs = ["--tstack=4096"]

[[lean_lib]]
name = "Fp"

[[lean_lib]]
name = "FpTheorems"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.27.0-rc1"

[[lean_exe]]
name = "fp-lean"
root = "Main"
