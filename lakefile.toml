name = "fp-lean"
version = "0.1.0"
defaultTargets = ["Fp", "fp-lean", "Examples"]
moreLeanArgs = ["--tstack=1000000"]
moreGlobalServerArgs = ["--tstack=1000000"]

[[lean_lib]]
name = "Fp"
# `Fp` (root + transitive) plus the `AgainstFloatModel` umbrella, which sits *above* `Fp`
# (it imports the full `Fp` to prove agreement with Lean's `Float.Model`) so cannot live
# inside `Fp.Theorems` without a cyclic import.
globs = ["Fp", "Fp.Theorems.AgainstFloatModel"]

[[lean_lib]]
name = "Examples"
# Only the `Examples` root module (and whatever it imports) is built. This keeps the heavy,
# non-CI `Examples/FastInvSqrtFp32.lean` (intentionally not imported) out of `lake build`.
globs = ["Examples"]

[[lean_exe]]
name = "fp-lean"
root = "Main"
