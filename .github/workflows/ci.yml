name: Core Library

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: core library (no mathlib)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        name: Checkout 🛎️

      - name: Install elan 🕑
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - id: cache-lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ runner.os }}-lake-core-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-1

      - name: Compile Library 🧐
        run: lake build
