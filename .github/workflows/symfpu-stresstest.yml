name: SymFPU stress test
on:
  push:
    branches:
      - "main"
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  stresstest:
    name: SymFPU experimental branch stress test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SymFPU experimental stress test (small formats)
        # Restrict the sweep to small formats to keep CI fast. The harness's
        # per-claim probes (E5M2, E4M3, E3M4) run regardless of the sweep bounds,
        # so the headline findings are still checked.
        run: python3 third-party/symfpu-experimental/stresstest.py --emin 3 --emax 5 --mmin 1 --mmax 4
